<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Schaufenster am Garnmarkt</title><link rel="stylesheet" href="basis.css">
<style>
body{color:var(--hell)} header{color:var(--hell)}
.text{position:fixed;left:clamp(16px,3.5vw,56px);bottom:clamp(28px,7vh,80px);z-index:3}
.unter{color:#E6E0D5}
</style></head><body>
<canvas id="c"></canvas>
<header><img src="../logo/estilo-logo.svg" alt="ESTILO Einrichtungsstudio" style="filter:invert(1) hue-rotate(180deg) brightness(1.4)"><nav><a href="#">Wohnwelten</a><a href="#">Ablauf</a><a href="#">Über Ebru</a><a href="#">Besuch</a></nav></header>
<div class="text"><h1>Räume, die<br><em>zu Ihnen</em> passen.</h1><p class="unter">Polstermöbel, Betten, Schränke und Esszimmer, ausgesucht und abgestimmt von Ebru Filiz. Am Garnmarkt 17 in Götzis.</p><a class="knopf" href="#">Beratung anfragen</a></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import { THREE, renderer, sofa, leuchten, lamellen, raum, FARBE } from './szene.js';
const r = renderer(document.getElementById('c'));
const s = new THREE.Scene(); s.background = new THREE.Color(0x23261f); s.fog = new THREE.Fog(0x23261f, 9, 22);
const innen = new THREE.Group(); innen.add(raum(), sofa(), leuchten(), lamellen()); s.add(innen);
innen.add(new THREE.HemisphereLight(0xffe6c4, 0x5a4630, 0.35));
// Fassade mit großem Schaufenster
const putz = new THREE.MeshStandardMaterial({ color: 0xbdb6aa, roughness: 0.95 }), rahmen = new THREE.MeshStandardMaterial({ color: 0x1c1d19, roughness: 0.4, metalness: 0.4 });
const z = 1.9, box = (w, h, x, y, m = putz, d = 0.4) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.receiveShadow = true; s.add(b); };
box(4, 6, -4.6, 2.2); box(4, 6, 4.6, 2.2); box(5.2, 1.2, 0, 3.9); box(5.2, 0.45, 0, -0.05);
box(5.24, 0.08, 0, 3.3, rahmen, 0.46); box(5.24, 0.08, 0, 0.18, rahmen, 0.46); box(0.08, 3.2, -2.6, 1.74, rahmen, 0.46); box(0.08, 3.2, 2.6, 1.74, rahmen, 0.46); box(0.05, 3.1, 0.9, 1.74, rahmen, 0.44);
const gehsteig = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), new THREE.MeshStandardMaterial({ color: 0x4a4a44, roughness: 0.9 })); gehsteig.rotation.x = -Math.PI / 2; gehsteig.position.set(0, -0.27, z + 6); s.add(gehsteig);
// Logo auf dem Glas
const img = new Image(); img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent((await (await fetch('../logo/estilo-logo.svg')).text()).replaceAll('currentColor', '#FFFDF9'));
await img.decode();
const cv = document.createElement('canvas'); cv.width = 1400; cv.height = 615; cv.getContext('2d').drawImage(img, 0, 0, 1400, 615);
const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
const schild = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.66), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0.92 }));
schild.position.set(1.75, 2.55, z + 0.21); s.add(schild);
const laterne = new THREE.PointLight(0xffc98a, 6, 9, 2); laterne.position.set(-5.5, 4.2, z + 3); s.add(laterne);
const cam = new THREE.PerspectiveCamera(42, 1, 0.05, 60);
const glatt = x => x * x * (3 - 2 * x);
function zeige(t) {
  const k = glatt(t);
  cam.position.set(-1.3 + k * 1.6, 1.55 - k * 0.15, 9.5 - k * 8.2); cam.lookAt(0.2 * k, 1.25, -0.5);
  document.querySelector('.text').style.opacity = 1 - glatt(Math.min(1, t / 0.35));
  r.render(s, cam);
}
function groesse() { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); zeige(window.__t ?? 0); }
addEventListener('resize', groesse);
window.setT = t => { window.__t = t; zeige(t); };
document.body.style.height = '400vh';
addEventListener('scroll', () => window.setT(scrollY / (document.body.scrollHeight - innerHeight)));
groesse(); window.bereit = true;
</script></body></html>
